# Render Blueprint — creates both services from this repository.
# Render dashboard → New → Blueprint → pick this repo. You will be asked for the
# values marked `sync: false` (they are secrets and never stored in git).
#
# Region: Frankfurt (EU) — keeps reader and customer data in the EU (GDPR).
# Plan: free — fine for staging/demo. Free services sleep after ~15 min idle
# (first visit then takes ~50 s) and have no persistent disk, so images uploaded in
# the CMS disappear on redeploy until EU object storage is connected (phase 8).

services:
  # Website + content manager (Next.js + Payload)
  - type: web
    name: nam-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @nam/web
    startCommand: npm run start -w @nam/web
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URI
        sync: false # MongoDB Atlas connection string (EU region)
      - key: OWNER_USERNAME
        value: rana # the single Superadmin (owner) signs in with this name
      - key: OWNER_NAME
        value: Rana # shown as "Howdy, Rana"
      - key: OWNER_PASSWORD
        sync: false # type it in Render only — never in git
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: INTERNAL_API_KEY # same secret as nam-api, copied automatically
        fromService:
          type: web
          name: nam-api
          envVarKey: INTERNAL_API_KEY
      - key: RESEND_API_KEY # contact form + newsletter emails, copied from nam-api
        fromService:
          type: web
          name: nam-api
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: nam-api
          envVarKey: EMAIL_FROM
      - key: S3_BUCKET
        sync: false # EU file storage (e.g. Cloudflare R2). Empty = files on server disk (lost on redeploy)
      - key: S3_ENDPOINT
        sync: false # R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: nam-api
          envVarKey: OPENAI_API_KEY # same key as the assistant; used by Staff → Translate
      - key: ASSISTANT_MODEL # Nora, the website's AI host (needs OPENAI_API_KEY)
        value: gpt-4.1
      - key: S3_PUBLIC_URL
        sync: false # optional: the bucket's public r2.dev or custom-domain address, for video streaming
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        sync: false # optional visitor statistics, loaded only after cookie consent
      - key: NEXT_PUBLIC_BOOKING_API_URL
        sync: false # the nam-api address, e.g. https://nam-api.onrender.com (needed at build time)

  # Booking API (Express)
  - type: web
    name: nam-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @nam/api
    startCommand: npm run start -w @nam/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URI
        sync: false # same connection string as nam-web
      - key: ALLOWED_ORIGINS
        sync: false # the website address, e.g. https://nam-web.onrender.com
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_… while testing
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_… from the Stripe webhook endpoint
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false # pk_test_… / pk_live_… (shows the Google Pay / Apple Pay sheet on the website)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. Nordic Affairs Media <tickets@yourdomain> (domain verified in Resend)
      - key: SUPPORT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false # optional: only for the SMS services (tickets by SMS, event reminder)
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false # your Twilio phone number or sender name
      - key: PAYMENT_MODE # demo = dummy payment page while Stripe keys are missing; remove when Stripe is live
        value: demo
      - key: INTERNAL_API_KEY # shared with nam-web for staff pages
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false # only needed for the AI assistant
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
